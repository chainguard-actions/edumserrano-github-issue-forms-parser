name: Test basic usage - parse simple issue form
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read issue body fixture
        id: read-body
        run: |
          BODY=$(cat "$GITHUB_WORKSPACE/tests/fixtures/simple-issue-body.md")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          template-filepath: '${{ github.workspace }}/tests/fixtures/simple-template.yml'
          issue-form-body: '${{ steps.read-body.outputs.body }}'

      - name: Assert parsed-issue output is non-empty JSON
        env:
          ACTUAL: ${{ steps.action.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is non-empty"

      - name: Assert bug-title field is parsed correctly
        env:
          ACTUAL: ${{ steps.action.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          BUG_TITLE=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('bug-title',''))")
          echo "bug-title: $BUG_TITLE"
          if [ "$BUG_TITLE" != "Login page crashes on submit" ]; then
            echo "FAIL: expected bug-title 'Login page crashes on submit' but got '$BUG_TITLE'"
            exit 1
          fi
          echo "PASS: bug-title matches expected value"

      - name: Assert severity field is parsed correctly
        env:
          ACTUAL: ${{ steps.action.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          SEVERITY=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('severity',''))")
          echo "severity: $SEVERITY"
          if [ "$SEVERITY" != "high" ]; then
            echo "FAIL: expected severity 'high' but got '$SEVERITY'"
            exit 1
          fi
          echo "PASS: severity matches expected value"
