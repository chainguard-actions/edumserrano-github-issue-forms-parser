name: Test basic issue form parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue form template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE"
          cat > "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE/test-form.yml" << 'EOF'
          name: Test Issue Form
          description: A test issue form.
          title: Test Issue
          body:
            - type: input
              id: title
              attributes:
                label: What is the title?
                placeholder: Enter title
              validations:
                required: true
            - type: textarea
              id: description
              attributes:
                label: Describe the issue
                placeholder: Enter description
              validations:
                required: true
            - type: dropdown
              id: priority
              attributes:
                label: Priority
                options:
                  - low
                  - medium
                  - high
              validations:
                required: true
          EOF

      - id: issue-parser
        uses: .
        with:
          template-filepath: '.github/ISSUE_TEMPLATE/test-form.yml'
          issue-form-body: |
            ### What is the title?

            My Test Title

            ### Describe the issue

            This is a test description.

            ### Priority

            high

      - name: Assert parsed-issue output is not empty
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          if [ -z "$PARSED" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is not empty"

      - name: Assert title field
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          TITLE=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['title'])")
          echo "title: $TITLE"
          if [ "$TITLE" != "My Test Title" ]; then
            echo "FAIL: expected title 'My Test Title', got '$TITLE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert description field
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          DESC=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['description'])")
          echo "description: $DESC"
          if [ "$DESC" != "This is a test description." ]; then
            echo "FAIL: expected description 'This is a test description.', got '$DESC'"
            exit 1
          fi
          echo "PASS"

      - name: Assert priority field
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          PRIORITY=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['priority'])")
          echo "priority: $PRIORITY"
          if [ "$PRIORITY" != "high" ]; then
            echo "FAIL: expected priority 'high', got '$PRIORITY'"
            exit 1
          fi
          echo "PASS"
