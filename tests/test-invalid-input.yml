name: Test invalid input handling

on:
  workflow_dispatch:

jobs:
  test-invalid-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GitHub issue forms parser with invalid issue body
        id: issue-parser-bad-input
        uses: .
        continue-on-error: true
        with:
          template-filepath: 'tests/fixtures/simple-template.yml'
          issue-form-body: '{}'

      - name: Assert action failed with invalid input
        env:
          OUTCOME: ${{ steps.issue-parser-bad-input.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid input but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid input (outcome=$OUTCOME)"
