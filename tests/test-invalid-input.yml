name: Test error handling - action fails on invalid issue body
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid issue body
        id: action
        uses: .
        continue-on-error: true
        with:
          template-filepath: '${{ github.workspace }}/tests/fixtures/simple-template.yml'
          issue-form-body: '{}'

      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid issue body but succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid issue body"
