name: Test optional fields with no response

on:
  workflow_dispatch:

jobs:
  test-no-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GitHub issue forms parser with no-response optional fields
        id: issue-parser
        uses: .
        with:
          template-filepath: 'tests/fixtures/simple-template.yml'
          issue-form-body: |
            ### Package name

            package-b

            ### Package version

            _No response_

      - name: Assert parsed-issue output is non-empty
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is non-empty"

      - name: Assert package-name field is set
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          PACKAGE_NAME=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('package-name',''))")
          echo "package-name: $PACKAGE_NAME"
          if [ "$PACKAGE_NAME" != "package-b" ]; then
            echo "FAIL: expected package-name to be 'package-b' but got '$PACKAGE_NAME'"
            exit 1
          fi
          echo "PASS: package-name is correct"

      - name: Assert package-version field is empty for no-response
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          PACKAGE_VERSION=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('package-version','MISSING'))")
          echo "package-version: '$PACKAGE_VERSION'"
          if [ "$PACKAGE_VERSION" != "" ]; then
            echo "FAIL: expected package-version to be empty for _No response_ but got '$PACKAGE_VERSION'"
            exit 1
          fi
          echo "PASS: package-version is empty as expected for _No response_"
