name: Test issue form parsing with optional fields
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue form template with optional fields
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE"
          cat > "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE/optional-form.yml" << 'EOF'
          name: Optional Fields Test Form
          description: A test form with optional fields.
          title: Optional Fields Test
          body:
            - type: input
              id: required-field
              attributes:
                label: Required field
                placeholder: Enter value
              validations:
                required: true
            - type: textarea
              id: optional-notes
              attributes:
                label: Optional notes
                description: This is optional.
                placeholder: Enter notes
            - type: dropdown
              id: optional-dropdown
              attributes:
                label: Optional dropdown
                description: This is optional.
                options:
                  - 'Yes'
                  - 'No'
          EOF

      - id: issue-parser
        uses: .
        with:
          template-filepath: '.github/ISSUE_TEMPLATE/optional-form.yml'
          issue-form-body: |
            ### Required field

            Some required value

            ### Optional notes

            _No response_

            ### Optional dropdown

            _No response_

      - name: Assert parsed-issue output is not empty
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          if [ -z "$PARSED" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is not empty"

      - name: Assert required field has value
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          VALUE=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['required-field'])")
          echo "required-field: $VALUE"
          if [ "$VALUE" != "Some required value" ]; then
            echo "FAIL: expected 'Some required value', got '$VALUE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert optional notes is empty when no response
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          NOTES=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['optional-notes'])")
          echo "optional-notes: '$NOTES'"
          if [ "$NOTES" != "" ]; then
            echo "FAIL: expected empty string for optional-notes with no response, got '$NOTES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert optional dropdown is empty when no response
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          DROPDOWN=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['optional-dropdown'])")
          echo "optional-dropdown: '$DROPDOWN'"
          if [ "$DROPDOWN" != "" ]; then
            echo "FAIL: expected empty string for optional-dropdown with no response, got '$DROPDOWN'"
            exit 1
          fi
          echo "PASS"
