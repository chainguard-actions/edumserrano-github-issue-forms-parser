name: Test checkboxes parsing

on:
  workflow_dispatch:

jobs:
  test-checkboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GitHub issue forms parser with checkboxes
        id: issue-parser
        uses: .
        with:
          template-filepath: 'tests/fixtures/checkboxes-template.yml'
          issue-form-body: |
            ### Title

            My test issue

            ### Notes

            _No response_

            ### Platforms

            - [X] Linux
            - [ ] macOS
            - [x] Windows

      - name: Assert parsed-issue output is non-empty
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is non-empty"

      - name: Assert title field
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          TITLE=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))")
          echo "title: $TITLE"
          if [ "$TITLE" != "My test issue" ]; then
            echo "FAIL: expected title to be 'My test issue' but got '$TITLE'"
            exit 1
          fi
          echo "PASS: title is correct"

      - name: Assert notes field is empty (no response)
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          NOTES=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('notes','MISSING'))")
          echo "notes: '$NOTES'"
          if [ "$NOTES" != "" ]; then
            echo "FAIL: expected notes to be empty (no response) but got '$NOTES'"
            exit 1
          fi
          echo "PASS: notes is empty as expected for _No response_"

      - name: Assert checkboxes - Linux checked
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          LINUX=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['platforms']['linux'])")
          echo "linux: $LINUX"
          if [ "$LINUX" != "True" ]; then
            echo "FAIL: expected linux checkbox to be True but got '$LINUX'"
            exit 1
          fi
          echo "PASS: linux checkbox is True"

      - name: Assert checkboxes - macOS unchecked
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          MACOS=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['platforms']['macos'])")
          echo "macos: $MACOS"
          if [ "$MACOS" != "False" ]; then
            echo "FAIL: expected macos checkbox to be False but got '$MACOS'"
            exit 1
          fi
          echo "PASS: macos checkbox is False"

      - name: Assert checkboxes - Windows checked
        env:
          ACTUAL: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "actual: $ACTUAL"
          WINDOWS=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['platforms']['windows'])")
          echo "windows: $WINDOWS"
          if [ "$WINDOWS" != "True" ]; then
            echo "FAIL: expected windows checkbox to be True but got '$WINDOWS'"
            exit 1
          fi
          echo "PASS: windows checkbox is True"
