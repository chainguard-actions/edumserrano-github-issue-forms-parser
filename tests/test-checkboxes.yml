name: Test issue form parsing with checkboxes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue form template with checkboxes
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE"
          cat > "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE/checkbox-form.yml" << 'EOF'
          name: Checkbox Test Form
          description: A test form with checkboxes.
          title: Checkbox Test
          body:
            - type: checkboxes
              id: operating-systems
              attributes:
                label: Which operating systems have you used?
                description: You may select more than one.
                options:
                  - label: macOS
                  - label: Windows
                  - label: Linux
          EOF

      - id: issue-parser
        uses: .
        with:
          template-filepath: '.github/ISSUE_TEMPLATE/checkbox-form.yml'
          issue-form-body: |
            ### Which operating systems have you used?

            - [X] macOS
            - [X] Windows
            - [ ] Linux

      - name: Assert parsed-issue output is not empty
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          if [ -z "$PARSED" ]; then
            echo "FAIL: parsed-issue output is empty"
            exit 1
          fi
          echo "PASS: parsed-issue output is not empty"

      - name: Assert macOS checkbox is true
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          MACOS=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d['operating-systems']['macos']).lower())")
          echo "macOS: $MACOS"
          if [ "$MACOS" != "true" ]; then
            echo "FAIL: expected macOS to be true, got '$MACOS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert Windows checkbox is true
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          WINDOWS=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d['operating-systems']['windows']).lower())")
          echo "Windows: $WINDOWS"
          if [ "$WINDOWS" != "true" ]; then
            echo "FAIL: expected Windows to be true, got '$WINDOWS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert Linux checkbox is false
        env:
          PARSED: ${{ steps.issue-parser.outputs.parsed-issue }}
        run: |
          echo "parsed-issue: $PARSED"
          LINUX=$(echo "$PARSED" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d['operating-systems']['linux']).lower())")
          echo "Linux: $LINUX"
          if [ "$LINUX" != "false" ]; then
            echo "FAIL: expected Linux to be false, got '$LINUX'"
            exit 1
          fi
          echo "PASS"
